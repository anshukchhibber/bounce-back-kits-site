<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Two-handled mug with a sip lid (printed handles + lid). -->
  <defs>
    <pattern id="ll" width="8" height="4" patternUnits="userSpaceOnUse"><rect width="8" height="1.3" fill="#2E2A26" opacity=".1"/></pattern>
    <clipPath id="mug"><path d="M60 66 H140 V146 A20 20 0 0 1 120 166 H80 A20 20 0 0 1 60 146 Z"/></clipPath>
  </defs>
  <ellipse cx="100" cy="176" rx="76" ry="8" fill="#2E2A26" opacity=".12"/>
  <!-- handles -->
  <path d="M60 84 H44 A14 14 0 0 0 30 98 V122 A14 14 0 0 0 44 136 H60" fill="none" stroke="#2E2A26" stroke-width="20" stroke-linejoin="round"/>
  <path d="M60 84 H44 A14 14 0 0 0 30 98 V122 A14 14 0 0 0 44 136 H60" fill="none" stroke="#E4674F" stroke-width="12" stroke-linejoin="round"/>
  <path d="M140 84 H156 A14 14 0 0 1 170 98 V122 A14 14 0 0 1 156 136 H140" fill="none" stroke="#2E2A26" stroke-width="20" stroke-linejoin="round"/>
  <path d="M140 84 H156 A14 14 0 0 1 170 98 V122 A14 14 0 0 1 156 136 H140" fill="none" stroke="#E4674F" stroke-width="12" stroke-linejoin="round"/>
  <path d="M36 100 V118" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".55"/>
  <!-- mug body -->
  <path d="M60 66 H140 V146 A20 20 0 0 1 120 166 H80 A20 20 0 0 1 60 146 Z" fill="#FFFFFF"/>
  <rect x="118" y="60" width="26" height="110" fill="#F3EBDD" clip-path="url(#mug)"/>
  <path d="M70 80 V146" stroke="#FBF7F2" stroke-width="6" stroke-linecap="round"/>
  <circle cx="100" cy="114" r="8" fill="#F2C14E"/>
  <path d="M86 126 A14 10 0 0 0 114 126" fill="none" stroke="#E4674F" stroke-width="5" stroke-linecap="round"/>
  <path d="M60 66 H140 V146 A20 20 0 0 1 120 166 H80 A20 20 0 0 1 60 146 Z" fill="none" stroke="#2E2A26" stroke-width="4" stroke-linejoin="round"/>
  <!-- lid -->
  <path d="M54 66 C 54 52 146 52 146 66 V72 H54 Z" fill="#7FB4C7"/>
  <path d="M120 56 C 136 58 146 60 146 66 V72 H120 Z" fill="#5E97AB"/>
  <path d="M54 66 C 54 52 146 52 146 66 V72 H54 Z" fill="url(#ll)"/>
  <path d="M54 66 C 54 52 146 52 146 66 V72 H54 Z" fill="none" stroke="#2E2A26" stroke-width="4" stroke-linejoin="round"/>
  <path d="M84 56 L88 40 H108 L112 56" fill="#7FB4C7" stroke="#2E2A26" stroke-width="4" stroke-linejoin="round"/>
  <path d="M66 62 Q80 56 96 55" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".55"/>
</svg>
