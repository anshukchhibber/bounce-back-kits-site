<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Baby bottle in a printed thumb-sparing cradle with a big loop handle (a grip aid — not a propping stand). -->
  <defs>
    <pattern id="ll" width="8" height="4" patternUnits="userSpaceOnUse"><rect width="8" height="1.3" fill="#2E2A26" opacity=".1"/></pattern>
    <clipPath id="body"><path d="M70 70 H122 V156 A12 12 0 0 1 110 168 H82 A12 12 0 0 1 70 156 Z"/></clipPath>
  </defs>
  <ellipse cx="104" cy="176" rx="66" ry="8" fill="#2E2A26" opacity=".12"/>
  <!-- teat + collar -->
  <path d="M84 50 C 84 32 90 18 96 18 C 102 18 108 32 108 50 Z" fill="#F3EBDD" stroke="#2E2A26" stroke-width="4" stroke-linejoin="round"/>
  <rect x="66" y="48" width="60" height="22" rx="6" fill="#7FB4C7"/>
  <rect x="110" y="48" width="16" height="22" rx="6" fill="#5E97AB"/>
  <rect x="66" y="48" width="60" height="22" rx="6" fill="none" stroke="#2E2A26" stroke-width="4"/>
  <!-- bottle body -->
  <path d="M70 70 H122 V156 A12 12 0 0 1 110 168 H82 A12 12 0 0 1 70 156 Z" fill="#EAF3F6"/>
  <rect x="68" y="104" width="56" height="66" fill="#FBF7F2" clip-path="url(#body)"/>
  <rect x="108" y="70" width="16" height="100" fill="#D3E6EC" opacity=".8" clip-path="url(#body)"/>
  <path d="M78 80 V150" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".8"/>
  <path d="M112 84 H118 M112 96 H118 M112 108 H118" stroke="#2E2A26" stroke-width="2.5" stroke-linecap="round" opacity=".5"/>
  <path d="M70 70 H122 V156 A12 12 0 0 1 110 168 H82 A12 12 0 0 1 70 156 Z" fill="none" stroke="#2E2A26" stroke-width="4" stroke-linejoin="round"/>
  <!-- cradle: band + loop handle -->
  <path d="M126 104 H150 A20 20 0 0 1 170 124 V132 A20 20 0 0 1 150 152 H126" fill="none" stroke="#2E2A26" stroke-width="20" stroke-linejoin="round"/>
  <path d="M126 104 H150 A20 20 0 0 1 170 124 V132 A20 20 0 0 1 150 152 H126" fill="none" stroke="#E4674F" stroke-width="12" stroke-linejoin="round"/>
  <path d="M152 108 A16 16 0 0 1 164 120" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".55"/>
  <rect x="62" y="96" width="68" height="64" rx="10" fill="#E4674F" opacity="0"/>
  <path d="M64 100 H128 V112 H64 Z M64 140 H128 V152 H64 Z" fill="#E4674F"/>
  <path d="M64 108 H128 V112 H64 Z M64 148 H128 V152 H64 Z" fill="#C9533D"/>
  <path d="M64 100 H128 V112 H64 Z M64 140 H128 V152 H64 Z" fill="url(#ll)"/>
  <path d="M64 100 H128 V112 H64 Z M64 140 H128 V152 H64 Z" fill="none" stroke="#2E2A26" stroke-width="4" stroke-linejoin="round"/>
  <rect x="122" y="98" width="12" height="58" rx="5" fill="#E4674F" stroke="#2E2A26" stroke-width="4"/>
</svg>
