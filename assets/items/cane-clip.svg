<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Cane & crutch clip (printed) parking a cane on a table edge. -->
  <defs>
    <pattern id="ll" width="8" height="4" patternUnits="userSpaceOnUse"><rect width="8" height="1.3" fill="#2E2A26" opacity=".1"/></pattern>
  </defs>
  <ellipse cx="108" cy="176" rx="80" ry="8" fill="#2E2A26" opacity=".12"/>
  <!-- table -->
  <rect x="160" y="104" width="16" height="70" fill="#E3D6C0" stroke="#2E2A26" stroke-width="4"/>
  <path d="M108 92 L124 82 H190 L184 92 Z" fill="#FBF7F2"/>
  <rect x="108" y="92" width="76" height="14" fill="#E3D6C0"/>
  <path d="M184 92 L190 82 V96 L184 106 Z" fill="#D2C3A8"/>
  <path d="M108 92 L124 82 H190 V96 L184 106 H108 Z" fill="none" stroke="#2E2A26" stroke-width="4" stroke-linejoin="round"/>
  <path d="M108 92 H184 L190 82" fill="none" stroke="#2E2A26" stroke-width="3" stroke-linejoin="round"/>
  <!-- cane -->
  <g transform="rotate(5 80 170)">
    <rect x="72" y="38" width="14" height="124" rx="7" fill="#2E2A26"/>
    <path d="M76 60 V150" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity=".3"/>
    <rect x="70" y="156" width="18" height="16" rx="5" fill="#5B534B" stroke="#2E2A26" stroke-width="3"/>
    <!-- crook handle -->
    <path d="M79 46 C 79 14 36 12 34 38 C 33 48 38 54 44 52" fill="none" stroke="#2E2A26" stroke-width="20" stroke-linecap="round"/>
    <path d="M79 46 C 79 14 36 12 34 38 C 33 48 38 54 44 52" fill="none" stroke="#F2C14E" stroke-width="12" stroke-linecap="round"/>
    <path d="M70 24 C 62 18 52 18 45 23" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".6"/>
  </g>
  <!-- clip: ring on the cane + bracket over the table edge -->
  <path d="M90 86 H132 V92 H114 V106 H132 V112 H90 Z" fill="#E4674F"/>
  <path d="M90 86 H132 V92 H114 V106 H132 V112 H90 Z" fill="url(#ll)"/>
  <path d="M90 86 H132 V92 H114 V106 H132 V112 H90 Z" fill="none" stroke="#2E2A26" stroke-width="4" stroke-linejoin="round"/>
  <rect x="68" y="84" width="30" height="30" rx="10" fill="#E4674F"/>
  <rect x="68" y="102" width="30" height="12" rx="6" fill="#C9533D"/>
  <rect x="68" y="84" width="30" height="30" rx="10" fill="url(#ll)"/>
  <path d="M74 90 H88" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".55"/>
  <rect x="68" y="84" width="30" height="30" rx="10" fill="none" stroke="#2E2A26" stroke-width="4"/>
</svg>
