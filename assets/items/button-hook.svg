<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Button hook (steel wire loop, printed handle) + two zipper-pull rings. -->
  <defs>
    <pattern id="ll" width="8" height="4" patternUnits="userSpaceOnUse"><rect width="8" height="1.3" fill="#2E2A26" opacity=".1"/></pattern>
    <clipPath id="handle"><path d="M72 92 C 58 92 52 104 54 120 L58 156 C 60 170 84 170 86 156 L90 120 C 92 104 86 92 72 92 Z"/></clipPath>
  </defs>
  <ellipse cx="100" cy="176" rx="74" ry="9" fill="#2E2A26" opacity=".12"/>
  <g transform="rotate(-14 72 130)">
    <!-- wire loop -->
    <path d="M72 92 C 58 70 62 38 72 18 C 82 38 86 70 72 92" fill="none" stroke="#2E2A26" stroke-width="10" stroke-linejoin="round"/>
    <path d="M72 92 C 58 70 62 38 72 18 C 82 38 86 70 72 92" fill="none" stroke="#CFC9C1" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- ferrule -->
    <rect x="64" y="84" width="16" height="14" rx="3" fill="#CFC9C1" stroke="#2E2A26" stroke-width="3.5"/>
    <!-- handle -->
    <path d="M72 92 C 58 92 52 104 54 120 L58 156 C 60 170 84 170 86 156 L90 120 C 92 104 86 92 72 92 Z" fill="#F2C14E"/>
    <rect x="76" y="90" width="20" height="84" fill="#D9A63A" clip-path="url(#handle)"/>
    <path d="M72 92 C 58 92 52 104 54 120 L58 156 C 60 170 84 170 86 156 L90 120 C 92 104 86 92 72 92 Z" fill="url(#ll)"/>
    <path d="M62 108 V140" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".55"/>
    <path d="M72 92 C 58 92 52 104 54 120 L58 156 C 60 170 84 170 86 156 L90 120 C 92 104 86 92 72 92 Z" fill="none" stroke="#2E2A26" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <!-- zipper-pull rings lying beside it -->
  <g fill="none" stroke-linecap="round">
    <ellipse cx="140" cy="158" rx="22" ry="13" stroke="#2E2A26" stroke-width="13"/>
    <ellipse cx="140" cy="158" rx="22" ry="13" stroke="#E4674F" stroke-width="7"/>
    <path d="M124 152 A22 13 0 0 1 146 145" stroke="#FFFFFF" stroke-width="2.5" opacity=".55"/>
    <ellipse cx="156" cy="128" rx="18" ry="11" stroke="#2E2A26" stroke-width="12"/>
    <ellipse cx="156" cy="128" rx="18" ry="11" stroke="#E4674F" stroke-width="6"/>
    <path d="M143 123 A18 11 0 0 1 160 117" stroke="#FFFFFF" stroke-width="2.5" opacity=".55"/>
  </g>
</svg>
