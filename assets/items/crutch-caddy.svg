<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Crutch caddy (printed cup holder + phone pocket) clipped to an underarm crutch. -->
  <defs>
    <pattern id="ll" width="8" height="4" patternUnits="userSpaceOnUse"><rect width="8" height="1.3" fill="#2E2A26" opacity=".1"/></pattern>
  </defs>
  <ellipse cx="100" cy="178" rx="74" ry="8" fill="#2E2A26" opacity=".12"/>
  <!-- crutch -->
  <g fill="#CFC9C1" stroke="#2E2A26" stroke-width="4" stroke-linejoin="round">
    <path d="M44 24 L52 24 L68 132 L60 132 Z"/>
    <path d="M92 24 L100 24 L84 132 L76 132 Z"/>
    <rect x="65" y="126" width="14" height="38" rx="5"/>
  </g>
  <rect x="34" y="12" width="76" height="18" rx="9" fill="#2E2A26"/>
  <path d="M44 18 H90" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".3"/>
  <rect x="50" y="78" width="46" height="12" rx="6" fill="#2E2A26"/>
  <rect x="63" y="160" width="18" height="16" rx="5" fill="#5B534B" stroke="#2E2A26" stroke-width="3"/>
  <!-- clamp to the rail -->
  <rect x="80" y="52" width="40" height="14" rx="6" fill="#C9533D" stroke="#2E2A26" stroke-width="3.5"/>
  <rect x="78" y="104" width="40" height="14" rx="6" fill="#C9533D" stroke="#2E2A26" stroke-width="3.5"/>
  <!-- cup in its ring -->
  <path d="M120 22 H164 L158 64 H126 Z" fill="#FFFFFF" stroke="#2E2A26" stroke-width="4" stroke-linejoin="round"/>
  <rect x="116" y="14" width="52" height="11" rx="5" fill="#7FB4C7" stroke="#2E2A26" stroke-width="4"/>
  <path d="M112 54 V72 A30 9 0 0 0 172 72 V54 Z" fill="#E4674F"/>
  <path d="M158 54 H172 V72 A30 9 0 0 1 158 80 Z" fill="#C9533D"/>
  <path d="M112 54 V72 A30 9 0 0 0 172 72 V54 Z" fill="url(#ll)"/>
  <path d="M112 54 V72 A30 9 0 0 0 172 72 V54" fill="none" stroke="#2E2A26" stroke-width="4" stroke-linejoin="round"/>
  <path d="M112 54 A30 9 0 0 0 172 54" fill="none" stroke="#2E2A26" stroke-width="4"/>
  <!-- phone pocket -->
  <rect x="126" y="88" width="34" height="56" rx="7" fill="#2E2A26"/>
  <rect x="131" y="94" width="24" height="30" rx="3" fill="#EAF3F6"/>
  <path d="M114 112 H172 V150 A10 10 0 0 1 162 160 H124 A10 10 0 0 1 114 150 Z" fill="#E4674F"/>
  <path d="M154 112 H172 V150 A10 10 0 0 1 162 160 H154 Z" fill="#C9533D"/>
  <path d="M114 112 H172 V150 A10 10 0 0 1 162 160 H124 A10 10 0 0 1 114 150 Z" fill="url(#ll)"/>
  <path d="M122 120 V146" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".55"/>
  <path d="M114 112 H172 V150 A10 10 0 0 1 162 160 H124 A10 10 0 0 1 114 150 Z" fill="none" stroke="#2E2A26" stroke-width="4" stroke-linejoin="round"/>
</svg>
