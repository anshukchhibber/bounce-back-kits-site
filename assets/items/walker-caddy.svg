<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Walker caddy (printed cup holder + small tray) clipped to a walker tube, holding a coffee. -->
  <defs>
    <pattern id="ll" width="8" height="4" patternUnits="userSpaceOnUse"><rect width="8" height="1.3" fill="#2E2A26" opacity=".1"/></pattern>
  </defs>
  <ellipse cx="104" cy="176" rx="78" ry="9" fill="#2E2A26" opacity=".12"/>
  <!-- walker frame section -->
  <rect x="30" y="14" width="14" height="160" rx="7" fill="#CFC9C1"/>
  <rect x="38" y="14" width="6" height="160" rx="3" fill="#A9A39B"/>
  <path d="M34 24 V160" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".6"/>
  <rect x="30" y="14" width="14" height="160" rx="7" fill="none" stroke="#2E2A26" stroke-width="4"/>
  <rect x="26" y="20" width="22" height="34" rx="8" fill="#2E2A26"/>
  <!-- clamp arm -->
  <rect x="26" y="98" width="52" height="18" rx="8" fill="#E4674F"/>
  <rect x="26" y="98" width="52" height="18" rx="8" fill="url(#ll)"/>
  <rect x="26" y="98" width="52" height="18" rx="8" fill="none" stroke="#2E2A26" stroke-width="4"/>
  <!-- coffee cup -->
  <path d="M78 58 H130 L124 112 H84 Z" fill="#FFFFFF" stroke="#2E2A26" stroke-width="4" stroke-linejoin="round"/>
  <path d="M80 74 H128 L126 90 H82 Z" fill="#7FB4C7" stroke="#2E2A26" stroke-width="3" stroke-linejoin="round"/>
  <rect x="74" y="48" width="60" height="12" rx="5" fill="#F3EBDD" stroke="#2E2A26" stroke-width="4"/>
  <path d="M98 40 Q94 32 100 26 M108 40 Q104 32 110 26" fill="none" stroke="#2E2A26" stroke-width="3" stroke-linecap="round" opacity=".35"/>
  <!-- tray shelf -->
  <path d="M128 112 H182 L176 130 H128 Z" fill="#F2C14E"/>
  <path d="M128 124 H178 L176 130 H128 Z" fill="#D9A63A"/>
  <path d="M128 112 H182 L176 130 H128 Z" fill="url(#ll)"/>
  <path d="M128 112 H182 L176 130 H128 Z" fill="none" stroke="#2E2A26" stroke-width="4" stroke-linejoin="round"/>
  <!-- glasses on the tray -->
  <g fill="#EAF3F6" stroke="#2E2A26" stroke-width="3">
    <circle cx="146" cy="104" r="8"/><circle cx="168" cy="104" r="8"/>
  </g>
  <path d="M154 103 H160" stroke="#2E2A26" stroke-width="3" stroke-linecap="round"/>
  <!-- cup ring -->
  <ellipse cx="104" cy="130" rx="32" ry="10" fill="#C9533D"/>
  <path d="M72 106 V130 A32 10 0 0 0 136 130 V106 Z" fill="#E4674F"/>
  <path d="M120 106 H136 V130 A32 10 0 0 1 120 139 Z" fill="#C9533D"/>
  <path d="M72 106 V130 A32 10 0 0 0 136 130 V106 Z" fill="url(#ll)"/>
  <path d="M80 112 V128" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".55"/>
  <path d="M72 106 V130 A32 10 0 0 0 136 130 V106" fill="none" stroke="#2E2A26" stroke-width="4" stroke-linejoin="round"/>
  <path d="M72 106 A32 10 0 0 0 136 106" fill="none" stroke="#2E2A26" stroke-width="4"/>
</svg>
