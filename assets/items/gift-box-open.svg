  <!-- inside back wall -->
  <path d="M30 98 L58 80 H180 L152 98 Z" fill="#B99A6E" stroke="#2E2A26" stroke-width="4" stroke-linejoin="round"/>
  <!-- tissue -->
  <path d="M36 98 C 30 74 48 62 62 74 C 64 52 92 46 100 66 C 108 46 140 50 138 74 C 150 62 174 70 166 92 L152 98 Z" fill="#FBE7E2" stroke="#2E2A26" stroke-width="4" stroke-linejoin="round"/>
  <path d="M62 74 C 66 82 72 88 80 92 M100 66 C 100 76 104 84 112 90 M138 74 C 136 82 134 88 128 94" fill="none" stroke="#F2A898" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M44 80 Q48 70 56 68 M80 58 Q88 52 96 56" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".8"/>
  <!-- side face -->
  <path d="M152 98 L180 80 V150 L152 168 Z" fill="#D2B386"/>
  <path d="M164 90 L172 85 V155 L164 160 Z" fill="#C24936"/>
  <path d="M152 98 L180 80 V150 L152 168 Z" fill="none" stroke="#2E2A26" stroke-width="4" stroke-linejoin="round"/>
  <!-- front face -->
  <rect x="30" y="98" width="122" height="70" fill="#E3C9A0"/>
  <rect x="30" y="98" width="122" height="70" fill="none" stroke="#2E2A26" stroke-width="4" stroke-linejoin="round"/>
  <path d="M38 108 H70" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".45"/>
  <!-- ribbon band -->
  <rect x="98" y="98" width="18" height="70" fill="#E4674F" stroke="#2E2A26" stroke-width="4"/>
  <!-- bounce stamp -->
  <circle cx="64" cy="134" r="20" fill="none" stroke="#C24936" stroke-width="3" opacity=".8"/>
  <circle cx="64" cy="127" r="5" fill="#F2C14E"/>
  <path d="M54 136 A10 7 0 0 0 74 136" fill="none" stroke="#E4674F" stroke-width="4.5" stroke-linecap="round"/>
