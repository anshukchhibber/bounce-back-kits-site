<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- One-hand dice tower (printed) with tray; two dice tumbling out. -->
  <defs>
    <pattern id="ll" width="8" height="4" patternUnits="userSpaceOnUse"><rect width="8" height="1.3" fill="#2E2A26" opacity=".1"/></pattern>
  </defs>
  <ellipse cx="100" cy="176" rx="78" ry="9" fill="#2E2A26" opacity=".12"/>
  <!-- tower side face -->
  <path d="M120 30 L140 20 V128 L120 140 Z" fill="#D9A63A"/>
  <path d="M120 30 L140 20 V128 L120 140 Z" fill="url(#ll)"/>
  <path d="M120 30 L140 20 V128 L120 140 Z" fill="none" stroke="#2E2A26" stroke-width="4" stroke-linejoin="round"/>
  <!-- tower top -->
  <path d="M64 30 L84 20 H140 L120 30 Z" fill="#F2C14E" stroke="#2E2A26" stroke-width="4" stroke-linejoin="round"/>
  <path d="M80 27 L90 22 H124 L114 27 Z" fill="#2E2A26"/>
  <!-- tower front -->
  <rect x="64" y="30" width="56" height="112" fill="#F2C14E"/>
  <rect x="64" y="30" width="56" height="112" fill="url(#ll)"/>
  <path d="M72 40 V100" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".55"/>
  <path d="M78 60 H106 M78 76 H106" stroke="#D9A63A" stroke-width="4" stroke-linecap="round"/>
  <rect x="64" y="30" width="56" height="112" fill="none" stroke="#2E2A26" stroke-width="4" stroke-linejoin="round"/>
  <!-- exit arch -->
  <path d="M74 142 V122 A18 18 0 0 1 110 122 V142 Z" fill="#2E2A26"/>
  <!-- tray -->
  <path d="M30 138 H170 L164 168 A6 6 0 0 1 158 172 H42 A6 6 0 0 1 36 168 Z" fill="#E4674F"/>
  <path d="M34 156 H166 L164 168 A6 6 0 0 1 158 172 H42 A6 6 0 0 1 36 168 Z" fill="#C9533D"/>
  <path d="M30 138 H170 L164 168 A6 6 0 0 1 158 172 H42 A6 6 0 0 1 36 168 Z" fill="url(#ll)"/>
  <path d="M30 138 H170 L164 168 A6 6 0 0 1 158 172 H42 A6 6 0 0 1 36 168 Z" fill="none" stroke="#2E2A26" stroke-width="4" stroke-linejoin="round"/>
  <path d="M40 146 H160" stroke="#2E2A26" stroke-width="3" stroke-linecap="round" opacity=".35"/>
  <!-- dice -->
  <g transform="rotate(-14 140 132)">
    <rect x="126" y="118" width="28" height="28" rx="6" fill="#FFFFFF" stroke="#2E2A26" stroke-width="4"/>
    <circle cx="134" cy="126" r="2.8" fill="#2E2A26"/><circle cx="140" cy="132" r="2.8" fill="#2E2A26"/><circle cx="146" cy="138" r="2.8" fill="#2E2A26"/>
  </g>
  <g transform="rotate(22 156 98)">
    <rect x="144" y="86" width="24" height="24" rx="5" fill="#FFFFFF" stroke="#2E2A26" stroke-width="4"/>
    <circle cx="151" cy="93" r="2.5" fill="#E4674F"/><circle cx="161" cy="103" r="2.5" fill="#E4674F"/>
  </g>
  <path d="M136 84 Q142 74 152 72 M128 98 Q130 90 136 86" fill="none" stroke="#2E2A26" stroke-width="3" stroke-linecap="round" opacity=".4"/>
</svg>
