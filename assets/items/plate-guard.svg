<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Plate guard (printed curved rim wall clipped to a plate). -->
  <defs>
    <pattern id="ll" width="8" height="4" patternUnits="userSpaceOnUse"><rect width="8" height="1.3" fill="#2E2A26" opacity=".1"/></pattern>
  </defs>
  <ellipse cx="100" cy="172" rx="84" ry="10" fill="#2E2A26" opacity=".12"/>
  <!-- plate -->
  <ellipse cx="100" cy="134" rx="82" ry="34" fill="#E3D6C0" stroke="#2E2A26" stroke-width="4"/>
  <ellipse cx="100" cy="128" rx="82" ry="34" fill="#FFFFFF" stroke="#2E2A26" stroke-width="4"/>
  <ellipse cx="100" cy="131" rx="52" ry="20" fill="#FBF7F2" stroke="#E3D6C0" stroke-width="3"/>
  <!-- a little dinner -->
  <ellipse cx="88" cy="132" rx="14" ry="7" fill="#F2C14E" stroke="#2E2A26" stroke-width="3"/>
  <circle cx="112" cy="128" r="4.5" fill="#7FB4C7" stroke="#2E2A26" stroke-width="2.5"/>
  <circle cx="120" cy="134" r="4.5" fill="#7FB4C7" stroke="#2E2A26" stroke-width="2.5"/>
  <circle cx="108" cy="137" r="4.5" fill="#7FB4C7" stroke="#2E2A26" stroke-width="2.5"/>
  <path d="M30 140 Q60 158 100 160" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".55"/>
  <!-- guard wall on the back-left rim -->
  <path d="M24 116 A82 34 0 0 1 146 100 V66 A82 34 0 0 0 24 82 Z" fill="#7FB4C7"/>
  <path d="M24 116 A82 34 0 0 1 146 100 V88 A82 34 0 0 0 24 104 Z" fill="#5E97AB"/>
  <path d="M24 116 A82 34 0 0 1 146 100 V66 A82 34 0 0 0 24 82 Z" fill="url(#ll)"/>
  <path d="M34 78 A82 34 0 0 1 118 62" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".55"/>
  <path d="M24 116 A82 34 0 0 1 146 100 V66 A82 34 0 0 0 24 82 Z" fill="none" stroke="#2E2A26" stroke-width="4" stroke-linejoin="round"/>
  <!-- clips over the rim -->
  <rect x="48" y="98" width="14" height="16" rx="4" fill="#5E97AB" stroke="#2E2A26" stroke-width="3"/>
  <rect x="112" y="90" width="14" height="16" rx="4" fill="#5E97AB" stroke="#2E2A26" stroke-width="3"/>
</svg>
