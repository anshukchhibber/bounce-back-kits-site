<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Easy jar & bottle opener (printed lever wrench on a jar). -->
  <defs>
    <pattern id="ll" width="8" height="4" patternUnits="userSpaceOnUse"><rect width="8" height="1.3" fill="#2E2A26" opacity=".1"/></pattern>
  </defs>
  <ellipse cx="94" cy="176" rx="62" ry="9" fill="#2E2A26" opacity=".12"/>
  <!-- jar -->
  <path d="M50 84 H118 A12 12 0 0 1 130 96 V158 A14 14 0 0 1 116 172 H52 A14 14 0 0 1 38 158 V96 A12 12 0 0 1 50 84 Z" fill="#EAF3F6"/>
  <path d="M108 84 H118 A12 12 0 0 1 130 96 V158 A14 14 0 0 1 116 172 H108 Z" fill="#D3E6EC"/>
  <rect x="38" y="112" width="92" height="36" fill="#FBF7F2" stroke="#2E2A26" stroke-width="3"/>
  <path d="M52 124 H96 M52 135 H82" stroke="#E4674F" stroke-width="4" stroke-linecap="round"/>
  <path d="M46 98 V104 M46 154 V160" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <path d="M50 84 H118 A12 12 0 0 1 130 96 V158 A14 14 0 0 1 116 172 H52 A14 14 0 0 1 38 158 V96 A12 12 0 0 1 50 84 Z" fill="none" stroke="#2E2A26" stroke-width="4" stroke-linejoin="round"/>
  <!-- lid -->
  <rect x="42" y="62" width="84" height="26" rx="6" fill="#F2C14E"/>
  <path d="M52 64 V86 M62 64 V86 M72 64 V86 M82 64 V86 M92 64 V86 M102 64 V86 M112 64 V86" stroke="#D9A63A" stroke-width="3"/>
  <rect x="42" y="62" width="84" height="26" rx="6" fill="none" stroke="#2E2A26" stroke-width="4"/>
  <!-- lever wrench: band around the lid + long handle -->
  <g transform="rotate(-22 128 75)">
    <rect x="118" y="64" width="70" height="22" rx="11" fill="#E4674F"/>
    <rect x="118" y="77" width="70" height="9" rx="4.5" fill="#C9533D"/>
    <rect x="118" y="64" width="70" height="22" rx="11" fill="url(#ll)"/>
    <path d="M132 70 H174" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity=".55"/>
    <rect x="118" y="64" width="70" height="22" rx="11" fill="none" stroke="#2E2A26" stroke-width="4"/>
  </g>
  <rect x="36" y="68" width="96" height="16" rx="6" fill="#E4674F"/>
  <rect x="36" y="78" width="96" height="6" rx="3" fill="#C9533D"/>
  <rect x="36" y="68" width="96" height="16" rx="6" fill="url(#ll)"/>
  <rect x="36" y="68" width="96" height="16" rx="6" fill="none" stroke="#2E2A26" stroke-width="4"/>
</svg>
