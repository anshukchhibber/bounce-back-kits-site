<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Pen with a large rounded ergonomic printed grip. -->
  <defs>
    <pattern id="ll" width="8" height="4" patternUnits="userSpaceOnUse"><rect width="8" height="1.3" fill="#2E2A26" opacity=".1"/></pattern>
    <clipPath id="grip"><path d="M80 96 C 74 76 82 62 100 62 C 118 62 126 76 120 96 C 116 110 116 124 118 136 C 120 148 112 156 100 156 C 88 156 80 148 82 136 C 84 124 84 110 80 96 Z"/></clipPath>
  </defs>
  <ellipse cx="100" cy="178" rx="62" ry="8" fill="#2E2A26" opacity=".12"/>
  <g transform="rotate(38 100 104)">
    <!-- barrel -->
    <rect x="90" y="4" width="20" height="70" rx="6" fill="#FBF7F2" stroke="#2E2A26" stroke-width="4"/>
    <rect x="104" y="10" width="5" height="40" rx="2.5" fill="#E4674F" stroke="#2E2A26" stroke-width="2.5"/>
    <!-- tip -->
    <path d="M90 150 H110 L100 182 Z" fill="#CFC9C1" stroke="#2E2A26" stroke-width="4" stroke-linejoin="round"/>
    <path d="M97 174 L100 184 L103 174 Z" fill="#2E2A26"/>
    <!-- grip -->
    <path d="M80 96 C 74 76 82 62 100 62 C 118 62 126 76 120 96 C 116 110 116 124 118 136 C 120 148 112 156 100 156 C 88 156 80 148 82 136 C 84 124 84 110 80 96 Z" fill="#7FB4C7"/>
    <rect x="104" y="58" width="24" height="102" fill="#5E97AB" clip-path="url(#grip)"/>
    <path d="M80 96 C 74 76 82 62 100 62 C 118 62 126 76 120 96 C 116 110 116 124 118 136 C 120 148 112 156 100 156 C 88 156 80 148 82 136 C 84 124 84 110 80 96 Z" fill="url(#ll)"/>
    <ellipse cx="96" cy="112" rx="8" ry="14" fill="#5E97AB"/>
    <path d="M86 78 Q88 70 96 68" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".55"/>
    <path d="M80 96 C 74 76 82 62 100 62 C 118 62 126 76 120 96 C 116 110 116 124 118 136 C 120 148 112 156 100 156 C 88 156 80 148 82 136 C 84 124 84 110 80 96 Z" fill="none" stroke="#2E2A26" stroke-width="4" stroke-linejoin="round"/>
  </g>
</svg>
