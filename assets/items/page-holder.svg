  <path d="M100 160 C 76 150 44 150 16 160 V82 C 44 72 76 72 100 82 C 124 72 156 72 184 82 V160 C 156 150 124 150 100 160 Z" fill="#7FB4C7" stroke="#2E2A26" stroke-width="4" stroke-linejoin="round"/>
