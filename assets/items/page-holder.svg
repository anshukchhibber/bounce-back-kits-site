  <path d="M60 144 Q100 150 140 144 Q126 154 100 156 Q74 154 60 144 Z" fill="#D9A63A"/>
  <path d="M54 140 Q100 118 146 140 Q126 154 100 156 Q74 154 54 140 Z" fill="url(#ll)"/>
  <path d="M66 136 Q84 128 96 127" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity=".6"/>
  <path d="M54 140 Q100 118 146 140 Q126 154 100 156 Q74 154 54 140 Z" fill="none" stroke="#2E2A26" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="100" cy="166" r="12" fill="#F2C14E" stroke="#2E2A26" stroke-width="4"/>
  <circle cx="100" cy="166" r="5.5" fill="#FBF7F2" stroke="#2E2A26" stroke-width="3"/>
