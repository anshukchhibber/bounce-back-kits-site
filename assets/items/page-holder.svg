  <path d="M100 74 V152" stroke="#2E2A26" stroke-width="3"/>
  <g stroke="#2E2A26" stroke-width="3" stroke-linecap="round" opacity=".4">
    <path d="M36 84 Q60 78 88 84 M36 96 Q60 90 88 96 M36 108 Q60 102 88 108 M36 120 Q60 114 76 118"/>
    <path d="M112 84 Q140 78 164 84 M112 96 Q140 90 164 96 M112 108 Q140 102 164 108 M124 120 Q144 114 164 120"/>
