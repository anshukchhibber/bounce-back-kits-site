<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480">
  <!-- Example photo for the lithophane preview (original artwork, grayscale): two people on a dock at sunset. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5E5E5E"/>
      <stop offset=".38" stop-color="#9C9C9C"/>
      <stop offset=".6" stop-color="#E2E2E2"/>
      <stop offset=".66" stop-color="#F7F7F7"/>
    </linearGradient>
    <radialGradient id="glow" cx="180" cy="292" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".2" stop-color="#FAFAFA" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FAFAFA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9C9C9"/>
      <stop offset=".45" stop-color="#8E8E8E"/>
      <stop offset="1" stop-color="#4A4A4A"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="360" height="480" fill="url(#sky)"/>
  <!-- soft clouds -->
  <g fill="#7A7A7A" opacity=".45">
    <ellipse cx="80" cy="96" rx="70" ry="12"/>
    <ellipse cx="120" cy="84" rx="44" ry="10"/>
    <ellipse cx="270" cy="140" rx="76" ry="11"/>
    <ellipse cx="300" cy="128" rx="40" ry="9"/>
    <ellipse cx="170" cy="190" rx="90" ry="7"/>
  </g>
  <circle cx="180" cy="292" r="170" fill="url(#glow)"/>
  <circle cx="180" cy="290" r="24" fill="#FFFFFF"/>

  <!-- birds -->
  <g fill="none" stroke="#4A4A4A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M226 206 q6 -6 12 0 q6 -6 12 0"/>
    <path d="M254 186 q4 -4 8 0 q4 -4 8 0"/>
  </g>

  <!-- far and near hills -->
  <path d="M0 292 C 40 270 80 268 120 282 C 150 292 168 288 190 280 C 230 266 280 266 320 282 C 336 288 350 290 360 290 V320 H0 Z" fill="#ABABAB"/>
  <path d="M0 306 C 50 296 96 300 140 310 C 200 318 260 300 360 306 V322 H0 Z" fill="#8A8A8A"/>

  <!-- lake -->
  <rect y="318" width="360" height="162" fill="url(#lake)"/>
  <path d="M164 320 H196 L214 470 H146 Z" fill="url(#streak)" opacity=".55"/>
  <g stroke="#EDEDED" stroke-linecap="round" opacity=".8">
    <path d="M150 330 H210" stroke-width="3"/>
    <path d="M140 342 H222" stroke-width="2.5"/>
    <path d="M158 354 H200" stroke-width="2.5"/>
  </g>
  <g stroke="#6E6E6E" stroke-linecap="round" stroke-width="2" opacity=".6">
    <path d="M30 360 H90 M260 352 H330 M20 400 H70 M290 410 H350 M60 440 H120 M250 450 H300"/>
  </g>

  <!-- pines framing the edges -->
  <g fill="#333333">
    <path d="M30 330 L30 300 L8 300 L30 262 L14 262 L34 226 L22 226 L40 190 L58 226 L46 226 L66 262 L50 262 L72 300 L50 300 L50 330 Z"/>
    <path d="M-6 336 L-6 290 L-20 290 L0 244 L-12 244 L6 206 L24 244 L12 244 L32 290 L18 290 L18 336 Z"/>
    <path d="M316 334 L316 304 L294 304 L316 268 L300 268 L320 232 L308 232 L326 196 L344 232 L332 232 L352 268 L336 268 L358 304 L336 304 L336 334 Z"/>
  </g>

  <!-- dock -->
  <path d="M104 480 L156 372 H216 L262 480 Z" fill="#2C2C2C"/>
  <g stroke="#555555" stroke-width="2">
    <path d="M150 384 H222 M140 404 H230 M128 428 H240 M116 454 H250"/>
    <path d="M176 372 L164 480 M196 372 L204 480" stroke="#3E3E3E"/>
  </g>
  <rect x="152" y="368" width="7" height="22" fill="#222222"/>
  <rect x="213" y="368" width="7" height="22" fill="#222222"/>

  <!-- two people sitting at the end of the dock, seen from behind -->
  <g fill="#1C1C1C">
    <!-- grown-up -->
    <path d="M158 372 C 156 352 160 340 172 336 C 180 333 190 336 194 346 C 197 356 196 366 196 372 Z"/>
    <circle cx="176" cy="322" r="12"/>
    <circle cx="170" cy="310" r="6.5"/>
    <!-- child, leaning in -->
    <path d="M194 372 C 193 360 196 352 204 350 C 211 349 217 354 218 362 C 219 367 219 370 219 372 Z"/>
    <circle cx="203" cy="339" r="8.5"/>
  </g>
  <!-- arm around the child's shoulder -->
  <path d="M190 344 C 200 342 210 346 214 354" fill="none" stroke="#1C1C1C" stroke-width="6" stroke-linecap="round"/>
</svg>
